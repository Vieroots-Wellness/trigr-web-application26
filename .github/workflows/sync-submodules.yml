# Auto-bump the backend/frontend submodule pointers to the latest `trigr` tip
# of each upstream repo. Fires on:
#   - repository_dispatch (sent by the upstream submodule repos on push)
#   - workflow_dispatch   (manual button in the Actions UI)
#   - schedule            (every 15 min, safety net if a dispatch is missed)
#
# Required repo secret:
#   SUBMODULE_PAT  — PAT with `contents: read` on both
#                    Vieroots-Wellness/limoverse and
#                    Vieroots-Wellness/limoverse_frontend, plus
#                    `contents: write` on this repo so the bump commit can push.

name: sync-submodules

on:
  repository_dispatch:
    types: [submodule-updated]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: sync-submodules
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout umbrella repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SUBMODULE_PAT }}
          fetch-depth: 0

      - name: Rewrite SSH submodule URLs to authenticated HTTPS
        env:
          PAT: ${{ secrets.SUBMODULE_PAT }}
        run: |
          git config --global \
            url."https://x-access-token:${PAT}@github.com/".insteadOf \
            "git@github.com:"

      - name: Initialize + fast-forward submodules to remote trigr
        run: |
          git submodule update --init --recursive
          git submodule update --remote --merge

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- backend frontend; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_sha=$(git -C backend rev-parse --short HEAD)"   >> "$GITHUB_OUTPUT"
            echo "frontend_sha=$(git -C frontend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit + push bump
        if: steps.diff.outputs.changed == 'true'
        env:
          BACKEND_SHA:  ${{ steps.diff.outputs.backend_sha }}
          FRONTEND_SHA: ${{ steps.diff.outputs.frontend_sha }}
          EVENT_NAME:   ${{ github.event_name }}
          REF_NAME:     ${{ github.ref_name }}
        run: |
          git config user.name  'trigr-bot'
          git config user.email 'trigr-bot@users.noreply.github.com'
          git add backend frontend
          MSG="chore: bump submodule pointers (auto) — backend ${BACKEND_SHA} / frontend ${FRONTEND_SHA} via ${EVENT_NAME}"
          git commit -m "$MSG"
          git push origin "HEAD:${REF_NAME}"
